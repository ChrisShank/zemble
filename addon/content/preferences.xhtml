<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>

<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label value="Paste your API key to connect your Semble library, create one">
    <label
      class="zotero-text-link keyboard-clickable"
      is="zotero-text-link"
      role="link"
      style="margin-left: 0.5ch"
      href="https://semble.so/settings/api-keys"
      value="here."
    ></label>
  </label>
  <hbox align="center" style="margin-left: 15px; margin-top: 10px">
    <html:label
      for="semble-api-key"
      data-l10n-id="pref-apiKey"
      style="width: 80px"
    ></html:label>
    <html:input
      type="password"
      id="semble-apiKey"
      preference="__prefsPrefix__.apiKey"
      placeholder="e.g. sl_abc123..."
      style="flex: 1; margin-left: 10px"
      rows="3"
      onblur="
        Zotero.__addonInstance__.hooks.onPrefsEvent('apiKey', {
          value: event.target.value,
        })
      "
    >
    </html:input>
  </hbox>
</groupbox>

<div
  style="
    display: flex;
    flex-direction: column;
    align-items: start;
    margin-top: 1rem;
  "
>
  <label value="Configure what is being synced to/from Semble. "></label>
  <div style="display: flex; gap: 5px; margin-left: 15px; margin-top: 10px">
    <html:input
      type="checkbox"
      id="semble-syncTags"
      preference="__prefsPrefix__.syncTags"
      style="flex: 1; margin-left: 10px"
      rows="3"
      oninput="
        Zotero.__addonInstance__.hooks.onPrefsEvent('syncTags', {
          checked: event.target.checked,
        })
      "
    >
    </html:input>
    <html:label for="semble-syncTags" data-l10n-id="pref-syncTags"></html:label>
  </div>

  <div style="display: flex; gap: 5px; margin-left: 15px; margin-top: 10px">
    <html:input
      type="checkbox"
      id="semble-syncConnections"
      preference="__prefsPrefix__.syncConnections"
      style="flex: 1; margin-left: 10px"
      rows="3"
      oninput="
        Zotero.__addonInstance__.hooks.onPrefsEvent('syncConnections', {
          checked: event.target.checked,
        })
      "
    >
    </html:input>
    <html:label
      for="semble-syncConnections"
      data-l10n-id="pref-syncConnections"
    ></html:label>
  </div>
</div>

<groupbox style="margin-top: 20px">
  <label>
    <html:h2 data-l10n-id="pref-about"></html:h2>
  </label>
  <label
    class="zotero-text-link keyboard-clickable"
    is="zotero-text-link"
    role="link"
    href="https://github.com/ChrisShank/zemble"
    value="Zemble Documentation"
  ></label>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__","build":"__env__"}'
  >
  </html:label>
</vbox>
