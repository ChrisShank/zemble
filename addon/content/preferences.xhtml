<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>

<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label value="Paste your API key to connect your Semble library, create one">
    <label
      class="zotero-text-link keyboard-clickable"
      is="zotero-text-link"
      role="link"
      style="margin-left: 0.5ch"
      href="https://semble.so/settings/api-keys"
      value="here."
    ></label>
  </label>
  <hbox align="center" style="margin-left: 15px; margin-top: 10px">
    <html:label
      for="semble-api-key"
      data-l10n-id="pref-api-key"
      style="width: 80px"
    ></html:label>
    <html:input
      type="password"
      id="semble-api-key"
      preference="__prefsPrefix__.apiKey"
      placeholder="e.g. sl_abc123..."
      style="flex: 1; margin-left: 10px"
      rows="3"
    >
    </html:input>
  </hbox>
</groupbox>

<groupbox style="margin-top: 20px">
  <label>
    <html:h2 data-l10n-id="pref-about"></html:h2>
  </label>
  <label
    class="zotero-text-link keyboard-clickable"
    is="zotero-text-link"
    role="link"
    href="https://github.com/ChrisShank/zemble"
    value="Zemble Documentation"
  ></label>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__","build":"__env__"}'
  >
  </html:label>
</vbox>
